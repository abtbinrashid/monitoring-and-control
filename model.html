<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Car model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/preload.js"></script>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/jsm/"

}

<body>
<div id="loading">
  <div class="load-box">
    <p class="load-label" id="loadLabel" data-i18n="loading">Loading model</p>
    <div class="load-bar"><div class="load-fill" id="loadFill"></div></div>
    <p class="load-pct" id="loadPct">0%</p>
  </div>
</div>
<canvas id="view"></canvas>

<nav id="pages">
  <a href="index.html" data-i18n="navSensors">Sensors &amp; systems</a>
  <a href="model.html" aria-current="page" data-i18n="navModel">Model</a>
  <button type="button" id="langBtn" lang="ar">العربية</button>
</nav>

<div id="cutRow" hidden>
  <label><input type="checkbox" id="cutToggle"> <span data-i18n="cutaway">Cutaway</span></label>
  <input type="range" id="cutSlider" min="-1" max="1" step="0.01" value="0.3" disabled
         data-i18n-aria="cutawayAria" aria-label="Cutaway depth">
</div>
<!-- CC-BY models must be credited. Put the model name, author and licence here. -->
<p id="credit" data-i18n-html="credit"></p>
