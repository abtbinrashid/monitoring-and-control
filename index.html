<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Car model</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="assets/css/style.css">
<!-- Start the model download during HTML parse, in parallel with three.js.
     Without this the 9.6 MB model cannot begin until the 1.3 MB module graph
     has downloaded and parsed. Progress is reported to main.js. -->
<script>
window.__modelURL = "assets/models/car.glb";
window.__modelBytes = 17416816;
window.__modelFetch = (async () => {
  const res = await fetch(window.__modelURL);
  if (!res.ok) throw new Error("HTTP " + res.status);
  if (!res.body) return res.arrayBuffer();          /* older browsers */
  const reader = res.body.getReader();
  const chunks = [];
  let loaded = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    loaded += value.length;
    if (window.__onModelProgress) window.__onModelProgress(loaded, window.__modelBytes);
  }
  const out = new Uint8Array(loaded);
  let at = 0;
  for (const c of chunks) { out.set(c, at); at += c.length; }
  return out.buffer;
})();
window.__modelFetch.catch(() => {});                /* handled in main.js */
</script>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/jsm/"
  }
}
</script>
</head>
<body>
<div id="loading">
  <div class="load-box">
    <p class="load-label" id="loadLabel">Loading model</p>
    <div class="load-bar"><div class="load-fill" id="loadFill"></div></div>
    <p class="load-pct" id="loadPct">0%</p>
  </div>
</div>
<canvas id="view"></canvas>

<div id="cutRow" hidden>
  <label><input type="checkbox" id="cutToggle"> Cutaway</label>
  <input type="range" id="cutSlider" min="-1" max="1" step="0.01" value="0.3" disabled
         aria-label="Cutaway depth">
</div>
